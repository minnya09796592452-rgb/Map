name: Extract Default Maps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PROJECTS/MISSION_3_TERRAIN/evidence/Default Maps.zip"
      - ".github/workflows/extract-default-maps.yml"

permissions:
  contents: write

concurrency:
  group: extract-default-maps
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract archive safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import zipfile

          archive = Path("PROJECTS/MISSION_3_TERRAIN/evidence/Default Maps.zip")
          output = Path("PROJECTS/MISSION_3_TERRAIN/evidence/extracted") / "Default Maps"

          if not archive.is_file():
              raise SystemExit("Default Maps.zip was not found in the Mission 3 evidence folder.")

          # Replace only this workflow-owned output directory.
          if output.exists():
              shutil.rmtree(output)
          output.mkdir(parents=True, exist_ok=True)

          total_size = 0
          max_total_size = 512 * 1024 * 1024
          max_files = 10000

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > max_files:
                  raise SystemExit(f"Archive has too many entries: {len(members)}")

              for info in members:
                  raw_name = info.filename.replace("\\", "/")
                  member = PurePosixPath(raw_name)

                  if member.is_absolute() or not member.parts or any(part in ("", ".", "..") for part in member.parts):
                      raise SystemExit(f"Unsafe archive path: {info.filename}")

                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlinks are not allowed in archive: {info.filename}")

                  total_size += info.file_size
                  if total_size > max_total_size:
                      raise SystemExit("Archive expands beyond the 512 MiB safety limit.")

                  destination = output.joinpath(*member.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  if info.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue

                  with zf.open(info) as source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)

          files = [p for p in output.rglob("*") if p.is_file()]
          print(f"Extracted {len(files)} files ({total_size:,} uncompressed bytes) to {output}.")
          if not files:
              raise SystemExit("The archive contained no files.")
          PY

      - name: Commit extracted files back to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "PROJECTS/MISSION_3_TERRAIN/evidence/extracted/Default Maps"
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
            exit 0
          fi
          git commit -m "Extract Default Maps archive"
          git push
